<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- LeetCode Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ffa116" />
    </linearGradient>

    <!-- Cyan Pulse Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffa116" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Base Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="11" y="11" width="106" height="106" rx="25" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Code Bracket & Algorithm Node Symbol (LeetCode + DSA Prep Emblem) -->
  <g transform="translate(18, 18)">
    <!-- Main LeetCode Bracket Path -->
    <path
      d="M60.5 83.2 L25.8 48.5 C23.5 46.2 23.5 42.5 25.8 40.2 L60.5 5.5 C62.8 3.2 66.5 3.2 68.8 5.5 L73.2 9.9 C75.5 12.2 75.5 15.9 73.2 18.2 L47.6 44.35 L73.2 70.5 C75.5 72.8 75.5 76.5 73.2 78.8 L68.8 83.2 C66.5 85.5 62.8 85.5 60.5 83.2 Z"
      fill="url(#gold-grad)"
      filter="url(#glow)"
    />

    <!-- Secondary Slash Bracket / Algorithm Nodes -->
    <path
      d="M52 14 L30 74"
      stroke="url(#cyan-grad)"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.9"
    />

    <path
      d="M72 44.35 L84 44.35"
      stroke="url(#gold-grad)"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Interactive Data Structure Nodes (Dots) -->
    <circle cx="28" cy="44.35" r="4.5" fill="#ffffff" />
    <circle cx="72" cy="14" r="4.5" fill="#38bdf8" />
    <circle cx="72" cy="74.7" r="4.5" fill="#3fb950" />
  </g>
</svg>